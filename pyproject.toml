[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhem-mcp"
version = "0.1.0"
description = "Phase 1 skeleton MCP server for safe, read-only FHEM config access"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
fhem-mcp = "fhem_mcp.__main__:main"
