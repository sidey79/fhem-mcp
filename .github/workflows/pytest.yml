name: pytest-and-publish

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run pytest
        run: pytest -q

  docker:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract project version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          print(pyproject["project"]["version"])
          PY
          )
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Build local amd64 image for Trivy scan
        if: matrix.platform == 'linux/amd64'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          tags: |
            local/fhem-mcp:trivy-scan
            ghcr.io/sidey79/fhem-mcp:${{ steps.version.outputs.value }}

      - name: Run Trivy scan
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/fhem-mcp:trivy-scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library

      - name: Validate Compose configuration
        if: matrix.platform == 'linux/amd64'
        env:
          FHEM_CONFIG_PATH: ${{ github.workspace }}/tests/fixtures
        run: docker compose config --quiet

      - name: Start Streamable HTTP bridge
        if: matrix.platform == 'linux/amd64'
        env:
          FHEM_CONFIG_PATH: ${{ github.workspace }}/tests/fixtures
        run: docker compose up --detach --no-build

      - name: Wait for Streamable HTTP bridge
        if: matrix.platform == 'linux/amd64'
        env:
          FHEM_CONFIG_PATH: ${{ github.workspace }}/tests/fixtures
        run: |
          for attempt in $(seq 1 30); do
            container_id=$(docker compose ps -q fhem-mcp-http)
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
            test "$status" = healthy && exit 0
            sleep 2
          done
          docker compose logs fhem-mcp-http
          exit 1

      - name: Smoke-test Streamable HTTP and tools
        if: matrix.platform == 'linux/amd64'
        env:
          FHEM_CONFIG_PATH: ${{ github.workspace }}/tests/fixtures
        run: docker compose exec -T fhem-mcp-http python - http://127.0.0.1:8000 < scripts/smoke_streamable_http.py

      - name: Smoke-test backward-compatible stdio entrypoint
        if: matrix.platform == 'linux/amd64'
        env:
          FHEM_CONFIG_PATH: ${{ github.workspace }}/tests/fixtures
        run: |
          response=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"docker-smoke","version":"1"}}}' | docker run --rm -i -v "${{ github.workspace }}/tests/fixtures:/config:ro" "ghcr.io/sidey79/fhem-mcp:${{ steps.version.outputs.value }}" --config-root /config mcp-stdio)
          grep -q '"name": *"fhem-mcp"' <<< "$response"

      - name: Stop Streamable HTTP bridge
        if: matrix.platform == 'linux/amd64' && always()
        env:
          FHEM_CONFIG_PATH: ${{ github.workspace }}/tests/fixtures
        run: docker compose down

      - name: Upload Trivy scan results to GitHub Security tab
        if: matrix.platform == 'linux/amd64' && always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Build image (no push on PR/non-main)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: ${{ matrix.platform }}

      - name: Build and push by digest (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download digest artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set image name
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Extract project version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          print(pyproject["project"]["version"])
          PY
          )
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          SOURCES=""
          for f in *; do
            SOURCES="$SOURCES $IMAGE@sha256:$f"
          done
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $SOURCES

      - name: Inspect multi-arch image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.version.outputs.value }}"
