name: bump-version-on-base-image-update

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  bump:
    if: github.event.label.name == 'bump-project-version'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Skip if already bumped
        id: check
        run: |
          if git log --format=%s | grep -qF "[bump-project-version]"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version in pyproject.toml
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          current=$(grep -oP '^version = "\K[0-9]+\.[0-9]+\.[0-9]+(?=")' pyproject.toml)
          IFS='.' read -r major minor patch <<< "$current"
          new="${major}.${minor}.$((patch + 1))"
          sed -i "s/^version = \"${current}\"/version = \"${new}\"/" pyproject.toml
          echo "Bumped fhem-mcp version: ${current} -> ${new}"

      - name: Commit and push
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump project version [bump-project-version]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
