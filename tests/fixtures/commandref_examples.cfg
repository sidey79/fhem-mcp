# Beispiele angelehnt an FHEM Commandref/Wiki-Syntax

define myCUL CUL /dev/ttyUSB0 0000
attr myCUL room Hardware

define lamp1 FS20 1234 11
attr lamp1 room Wohnzimmer
attr lamp1 alias Deckenlampe

define vccu CUL_HM 123456
attr vccu model CCU-FHEM
attr vccu IOList myCUL

# global attribute example (often seen in docs)
attr global userattr myMode myZone

# include and multiline example
include rooms/common.cfg

define FileLog_lamp1 FileLog /var/log/fhem/lamp1-%Y.log lamp1
